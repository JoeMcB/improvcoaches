services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER:     improvcoaches
      POSTGRES_PASSWORD: improvcoaches
    ports:
      - '5432:5432'
    volumes:
      - improvcoaches-postgres-17:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    ports:
      - '6379:6379'
    volumes:
      - improvcoaches-redis-7:/data

  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    
    tty: true
    stdin_open: true
    
    environment:
      - SPROCKETS_CACHE=/cache
      - REDISTOGO_URL=redis://redis:6379
      - DATABASE_URL=postgres://improvcoaches:improvcoaches@postgres:5432/improvcoaches_development
      - TEST_DATABASE_URL=postgres://improvcoaches:improvcoaches@postgres:5432/improvcoaches_test

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/workspace:cached
      - improvcoaches-node-modules:/workspace/node_modules
      # [Custom] Add asset cache.
      - improvcoaches-asset-cache:/cache
      
    ports:
      - '3000:3000'

    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
  
volumes:
  improvcoaches-asset-cache:
  improvcoaches-node-modules:
  improvcoaches-postgres-17:
  improvcoaches-redis-7:
